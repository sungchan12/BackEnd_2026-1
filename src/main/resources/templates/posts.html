<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #fff;
            font-family: Arial, sans-serif;
            padding: 24px 32px;
        }

        .board-tag {
            display: inline-block;
            border: 1.5px solid #222;
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .article-list {
            display: flex;
            flex-direction: column;
        }

        .article {
            padding: 14px 12px;
            cursor: pointer;
        }

        .article:hover {
            border: 1.5px solid #222;
            border-radius: 4px;
            padding: 13px 11px;
        }

        .article h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .article .meta {
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
        }

        .article .content {
            font-size: 14px;
            color: #333;
        }

        .empty {
            color: #888;
            font-size: 15px;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<span class="board-tag" th:text="${boardName}">게시판</span>

<div class="article-list">
    <p th:if="${#lists.isEmpty(articles)}" class="empty">등록된 게시글이 없습니다.</p>

    <div class="article" th:each="article : ${articles}">
        <h2 th:text="${article.title}"></h2>
        <p class="meta">
            <span th:text="${article.authorName}"></span>
            |
            <span th:text="${article.createdAt != null} ? ${#temporals.format(article.createdAt, 'yyyy-MM-dd')} : '-'"></span>
        </p>
        <p class="content" th:text="${article.content}"></p>
    </div>
</div>

</body>
</html>
